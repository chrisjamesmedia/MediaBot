# Signal Seeker: Chris James's paper, made with MediaBot. Editing the paper means editing this file.
# Everything the build and the daily routine need about this paper lives here.

name: Signal Seeker
slug: signal-seeker            # URL: /signal-seeker/ and /signal-seeker/YYYY-MM-DD/
public: true                   # false = left off the root index, pages carry noindex
reader: Chris James
description: >-
  A calm, finite daily paper that replaces the X feed: the best of the accounts
  Chris James reads, a few evergreen long reads, and only the news that is
  really big, with a clear end.

masthead:
  style: quiet                 # quiet = small serif name, left-aligned, no tagline
  weather:
    label: Boston
    lat: 42.36
    lon: -71.06
    timezone: America/New_York

print:
  size: medium                 # small | medium | large  (see sizes below)
  sizes:                       # sheets of Letter paper, printed double-sided
    small:  {target_sheets: [1, 2], max_sheets: 2}
    medium: {target_sheets: [4, 5], max_sheets: 5}
    large:  {target_sheets: [6, 10], max_sheets: 10}
  photos: false                # print edition never carries photos
  qr: true                     # one masthead QR to the web edition, only once web_base is public

sunday:                        # Sundays: the bigger paper, with Funnies (comics + puzzles) on
  size: large
  enable: [funnies]

web:
  images: true                 # big lead image and opted-in photos on the web edition
  # "Tune tomorrow's paper": a more-of / less-of block at the end of the web edition. Chips are picked per edition
  # from what is in it (an option shows only when its section is in the edition, or its words appear in 2+ items),
  # in this order, then the fixed ones; at most max_options. Send opens a prefilled GitHub issue (site.yaml `requests`).
  tune:
    enabled: true
    max_options: 10
    options:
      # The Passage: the routine records these two in papers/<slug>/taste.json (tools/passage.py reads it).
      - {label: "Keep: today's passage",       section: passage}
      - {label: "Never again: today's passage", section: passage}
      - {label: More AI infrastructure, words: [gpu*, data center*, datacenter*, neocloud*, compute, hbm, inference, capex, hyperscaler*, optical]}
      - {label: More investing,          section: investments}
      - {label: Fewer market posts,      section: investments}
      - {label: More long reads,         section: evergreen}
      - {label: More from Substack,      section: substack}
      - {label: More YouTube summaries,  section: youtube}
      - {label: More science & health,   section: science}
      - {label: More comics & puzzles,   section: funnies}
      - {label: More on my holdings,     section: holdings}
      - {label: More from the GOATs,     section: goats}
      - {label: Fewer headlines,         part: news}
    fixed: [Shorter paper, More new voices]
  # "One more helping": one extra, pre-built serving at the end of the X part of the web edition, revealed once
  # by a button. count = the next posts from the same home-feed ranking (tools/x_feed.py); socials = up to this
  # many Substack/YouTube items the routine adds, only when those sources are connected. Never in the PDFs.
  seconds:
    enabled: true
    count: 8
    socials: 3

# The edition reads by source, in this order: X → Substack/YouTube (when connected) → Evergreen →
# Around the Web → News (small) → The Passage → Funnies & Games. Topic sections below nest inside those parts.
# Sections, in paper order. `weight` sets emphasis: when the print edition is
# over its size, the lowest-weight sections lose their last items first, and
# the daily routine uses weights to decide how many items each section gets.
sections:
  # Front Page: from X only (a post, or a story whose sources are all X posts). Anything else drops to News.
  - {id: front,       title: Front Page,       enabled: true,  weight: 10, max_items: 4, require_source: x}
  # Top of your feed: X's own recommendations, ranked from the reader's home timeline (tools/x_feed.py).
  # enabled = on/off, max_items = how many posts (fixed, finite; no "load more"). Tuning: sources.x.home_feed.
  - {id: feed,        title: Top of your feed, enabled: true,  weight: 9,  max_items: 8,
     dek: "The most-engaged posts from your home timeline in the last 24 hours, a few per day and no more."}
  - {id: x,           title: From Your X,      enabled: true,  weight: 9,  max_items: 10}
  - {id: goats,       title: The GOATs,        enabled: true,  weight: 9,  max_items: 5}
  - {id: investments, title: Investments,      enabled: true,  weight: 10, max_items: 12, group_by: theme}
  # Holdings: material news only, public by Chris's OK. Never values, share counts or position sizes (the build refuses them).
  - {id: holdings,    title: Your Holdings,    enabled: true,  weight: 8,  max_items: 6,  group_by: ticker}
  - {id: tech,        title: Tech & AI,        enabled: true,  weight: 7,  max_items: 10}
  - {id: reading,     title: Worth Reading,    enabled: true,  weight: 6,  max_items: 4,  source_group: web}
  # Evergreen: 2–4 lasting pieces from Chris's own X (long-form X Articles, substantive threads, his bookmarks
  # and likes, essays/long interviews his accounts shared). Never invented; never repeated (evergreen_seen.json).
  - {id: evergreen,   title: Evergreen,        enabled: true,  weight: 7,  max_items: 4}
  - {id: business,    title: Business,         enabled: true,  weight: 3,  max_items: 3}
  - {id: science,     title: Science & Health, enabled: true,  weight: 3,  max_items: 5}
  - {id: local,       title: Local,            enabled: true,  weight: 3,  max_items: 4}
  - {id: bigstuff,    title: The Big Stuff,    enabled: true,  weight: 2,  max_items: 5,  style: box, only_if_major: true}
  # Links: x.com links file under the X part; other links under Around the Web.
  - {id: worth,       title: Worth Your Time,  enabled: true,  weight: 2,  max_items: 6,  style: links, dedupe: true}
  # Not connected yet. Turn on once a source exists; never filled with stand-in content.
  - {id: substack,    title: Substack,         enabled: false, weight: 8,  max_items: 4}
  - {id: youtube,     title: YouTube,          enabled: false, weight: 6,  max_items: 3}
  # Funnies: real comics from feeds (tools/funnies.py, xkcd RSS) plus generated sudoku and word search. On Sundays.
  - {id: funnies,     title: Funnies,          enabled: false, weight: 1,  max_items: 4}
  # The Passage: one quote, poem, scripture or short speech excerpt a day (tools/passage.py). Verified items in
  # passages.json carry a fetched source URL that prints with them; throwbacks from Chris's old quote bank
  # (quote_bank.json, local only) print as "From your old quote bank", text and author only.
  - {id: passage,     title: The Passage,      enabled: true,  weight: 5,  max_items: 1}
  # Games: mental math, a Wason four-card task, a 5x5 crossword and a riddle (tools/games.py), every day.
  # Answers: "Show answer" on the web; the Answers block on the last page in print.
  - {id: games,       title: Games,            enabled: true,  weight: 3,  max_items: 4}
  # private: true = only in the local private copy (site-private/), never in the public site, PDFs, sitemap or meta.
  # Odds & Ends is the personal section: emails, calendar, birthdays, reminders, notes.
  - {id: personal,    title: Odds & Ends,      enabled: false, weight: 1,  max_items: 6,  private: true}

# News: pared way down. Every legacy/web news item (front-page leftovers, Business, Science, Tech…) is pooled
# into one small "News" part, after X and Evergreen. Holdings news sits beside it with its own cap.
news:
  title: Headlines
  max_items: 4                 # 3–4 brief items: headline + one sentence
  weight: 4
  major_only_sections: [bigstuff, local]   # these only make the paper with `major: true`
  # Cut everywhere (X items too) unless the item carries `major: true`: a US election result, a market
  # crash, a major disaster. Items carry `topic: [...]` in edition.json.
  exclude_topics: [war, conflict, geopolitics, military, macro, rates, oil, energy-prices, politics, elections,
                   partisan, crime, protest, world, local, policy]
  keep_topics: [tech, ai, business, markets, investing, science, health, metabolic, psychedelics, space, culture, ideas]
  major_means: >-
    Front-page-of-every-paper big: a US national election result, a market crash or circuit breaker,
    a major US disaster or a genuinely historic event. Not: a war update, a tanker strike, a Fed hold,
    a G20 communiqué, a poll, a protest, local crime.

sources:
  x:
    lists:
      - {name: Investments, feeds: investments}
      - {name: 2026 GOATS,  feeds: goats}
    must_read:                 # always checked; best post each goes to From Your X
      - "@FU_joehudson"
      - "@p_millerd"
      - "@naval"
      - "@paulg"
      - "@davidsenra"
    goats:                     # one best post or idea each, when they have one
      - "@GavinSBaker"
      - "@ChrisCamillo"
      - "@aleabitoreddit"
      - "@ParadisLabs"
      - "@DavidGeorge83"
    home_feed:                 # "Top of your feed" (tools/x_feed.py over get_users_timeline dumps)
      reader_handle: "@ChrisJamesUSA"   # the reader's own posts are never picked
      window_hours: 24
      per_author: 1            # at most one post per author, so the section is a spread of voices
      min_chars: 120           # substantive posts only (URLs and @mentions don't count); drops one-line memes
      max_chars: 600           # long posts clipped at a sentence end; "Open on X" has the rest
      min_reposters: 2         # a repost of someone you don't follow counts only if 2+ people you follow reposted it
      require_topic: true      # keep only posts on these topics (or from accounts in your source lists)
      topic_words: [ai, agi, llm*, gpt*, openai, anthropic, claude, gemini, grok, nvidia, gpu*, compute, chip*,
                    semiconductor*, memory, hbm, dram, nand, data center, datacenter*, inference, model, robot*,
                    software, startup*, founder*, vc, venture, invest*, stock, market, earnings, revenue, margin*,
                    valuation*, capex, hyperscaler*, cloud, saas, tesla, spacex, starship, space, rocket*, science,
                    scientist*, research*, study, physics, biology, health, metabolic, longevity, sleep, exercise,
                    nutrition, psychedelic*, book, essay, writing, learn*, business, company, product, engineer*,
                    code, coding, programming, math, energy storage, battery, nuclear, fusion, quantum]
      # Cut topics (news.exclude_topics) as words; a post that mentions one is skipped. Whole words (plural ok);
      # a trailing * matches any ending.
      skip_words: [trump*, biden, harris, vance, obama, democrat, republican, gop, maga, liberal, conservative,
                   leftist, woke, election, ballot, voter, vote, congress, senate, governor, mayor, labour, tory,
                   starmer, farage, parliament, migrant, immigra*, deport*, border, israel*, gaza, hamas, hezbollah,
                   palestin*, ukrain*, russia, putin, zelensk*, iran, china's military, taiwan strait, war, missile,
                   military, troops, nato, ceasefire, terror*, fed, powell, rate cut, rate hike, inflation, cpi,
                   tariff, recession, treasury yield, oil price, opec, crude, stabbing, shooting, murder*, police,
                   arrest, protest, riot, crime, killed, prison, charlie kirk, epstein]
    accounts_file: sources/x_accounts.json   # 100 tiered accounts from the reader profile
    noise:                     # skip entirely
      - "@TheGNPE"
      - "@TheValueist"
      - "@PortPolitics1"
      - "@PBDsPodcast"
      - "@TickerDUBS"
      - "@ndenverco"
      - "@newstart_2024"
      - "@kator1313"
      - "@LibertyCappy"
      - "@cheruiyotkb"
      - "@squawksquare"
    caps:                      # max posts per edition from one account
      "@ParadisLabs": 2
      "@rdd147": 2
      default: 3
    downweight:
      - hype or promo lists ("simply buy these 7 stocks", "save this"): summarize the claim, never headline it
      - Edge City retweets: keep the community theme, drop the retweets
      - Bitcoin influencers: only for major moves
      - partisan outrage: politics only when it moves markets
  holdings:                    # Your Holdings: material news only, no prices or tickers tables
    - {ticker: NBIS, name: Nebius}
    - {ticker: MU,   name: Micron}
    - {ticker: SNDK, name: SanDisk}
    - {ticker: AMZN, name: Amazon}
    - {ticker: META, name: Meta}
  web:                         # legacy and web sources for the news sections
    - AP
    - CNBC
    - Bloomberg
    - The Verge
    - Ars Technica
    - Nature
    - NHPR
    - WMUR
    - Boston Globe
    - WBUR
  substack: []                 # not connected yet
  youtube: []                  # not connected yet

filters:
  novelty: loose               # loose for now: a story seen yesterday can run again if it moved
  notes:
    - Investments is the largest section; organize it by theme, not by author.
    - Show bull and bear views; Chris bookmarks skeptics too.
    - Thesis over hype. Reflective over promotional.
    - Holdings appear only with material news.
    - No like counts, prices tables, tickers, taglines or filler labels.
